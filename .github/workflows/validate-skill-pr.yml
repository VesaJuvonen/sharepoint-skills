name: Validate skills

on:
  pull_request:
    paths:
      - "Skills/**"
      - ".github/scripts/validate_skills.py"
      - ".github/workflows/validate-skill-pr.yml"
      - "CONTRIBUTING.md"
  push:
    branches:
      - main
    paths:
      - "Skills/**"
      - ".github/scripts/validate_skills.py"
      - ".github/workflows/validate-skill-pr.yml"
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all skills
        id: validate
        continue-on-error: true
        run: >-
          python .github/scripts/validate_skills.py
          --root .
          --report "$RUNNER_TEMP/skill-validation.md"

      - name: Publish validation summary
        if: always()
        run: cat "$RUNNER_TEMP/skill-validation.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request validation comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/skill-validation.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- skill-validation-report -->";
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const body = `${marker}\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail when validation reports errors
        if: steps.validate.outcome != 'success'
        run: exit 1